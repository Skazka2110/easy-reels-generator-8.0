[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "easy-reels-generator"
version = "0.8.0"
description = "Portable desktop Reels generator by ProAI"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "openpyxl>=3.1,<4",
  "Pillow>=11,<13",
  "PySide6>=6.8,<6.10",
  "cryptography>=44,<47",
  "certifi>=2025.1",
]

[project.scripts]
easy-reels = "easy_reels.cli:main"
easy-reels-gui = "easy_reels.gui.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
easy_reels = ["assets/*.png", "assets/*.json"]
