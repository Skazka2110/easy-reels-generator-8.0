name: Build Easy Reels Generator

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Automated tests
    runs-on: ubuntu-latest
    steps:
      - name: Download sources
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install application and tests
        run: python -m pip install . pytest

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

  macos:
    name: macOS ${{ matrix.label }}
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            label: ARM64
          - runner: macos-15-intel
            label: Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Download sources
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install FFmpeg
        run: brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg

      - name: Build macOS application
        run: chmod +x packaging/macos/build-macos.sh && packaging/macos/build-macos.sh

      - name: Upload macOS archive
        uses: actions/upload-artifact@v4
        with:
          name: Easy-Reels-Generator-macOS-${{ matrix.label }}-v080
          path: artifacts/macos/Easy_Reels_Generator_macOS_${{ matrix.label }}_v080.zip
          if-no-files-found: error

  windows:
    name: Windows x64
    needs: tests
    runs-on: windows-2022
    steps:
      - name: Download sources
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: "x64"

      - name: Build Windows application
        shell: powershell
        run: ./packaging/windows/build-portable.ps1

      - name: Upload Windows archive
        uses: actions/upload-artifact@v4
        with:
          name: Easy-Reels-Generator-Windows-x64-v080
          path: artifacts/windows/Easy_Reels_Generator_Windows_x64_v080.zip
          if-no-files-found: error
